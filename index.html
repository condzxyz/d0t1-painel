:root{--bg:#FBFCF8;--card:#FFFFFF;--ink:#16160F;--mut:#6E6E66;--faint:#A8A89E;--line:#E8EDD8;--line2:#DDE5C8;--lime:#B6FF2E;--limebar:#EFF8D8;--limeink:#1A2E05;--pos:#3F8F29;--neg:#B4231F;--soft:#F4F5EF;color-scheme:light;
--sans:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;--px:'Geist Pixel','JetBrains Mono',ui-monospace,monospace;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;background-image:radial-gradient(rgba(22,22,15,.055) 1px,transparent 1px);background-size:26px 26px}
.nav{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.nav-in{max-width:1040px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font:500 22px var(--mono);letter-spacing:.06em}
.nav-r{display:flex;align-items:center;gap:22px;color:var(--mut);font-size:15px}
.strip{background:var(--limebar);border-bottom:1px solid var(--line2);padding:12px 24px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;font-weight:600;font-size:15px;text-align:center}
.pill{font:500 12px var(--mono);letter-spacing:.08em;background:var(--lime);color:var(--limeink);padding:5px 12px;border-radius:999px}
.btn{font:600 16px var(--sans);padding:14px 26px;border-radius:999px;border:1px solid var(--lime);background:var(--lime);color:var(--ink);cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(.95)}
.ghost{background:transparent;border-color:var(--line2);color:var(--ink);font-weight:500;padding:8px 16px;font-size:14px}
.ghost:hover{background:var(--card)}
:focus-visible{outline:2px solid var(--limeink);outline-offset:3px}
.gate{max-width:1040px;margin:0 auto;padding:clamp(56px,12vw,120px) 24px}
.gate h1,.hero h1{font:700 clamp(40px,7.4vw,84px)/.98 var(--sans);letter-spacing:-.045em;margin:0;text-wrap:balance}
.px{font-family:var(--px);font-weight:400;letter-spacing:-.01em}
.gate p,.lede{color:var(--mut);font-size:clamp(17px,2vw,20px);max-width:52ch;margin:22px 0 0}
.gate form{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap;max-width:520px}
input{flex:1 1 220px;font:400 17px var(--mono);padding:14px 22px;border:1px solid var(--line2);border-radius:999px;background:var(--card);color:var(--ink)}
input::placeholder{color:var(--faint)}
.err{color:var(--neg);font-size:14px;min-height:1.5em;margin-top:12px;font-family:var(--mono)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.btn{transition:none}}
main{max-width:1040px;margin:0 auto;padding:clamp(40px,8vw,80px) 24px 64px;display:grid;gap:40px}
.periods{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.per{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;display:grid;gap:22px}
.per-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.per-h .lbl{font:700 24px var(--sans);letter-spacing:-.02em}
.sub{font:500 12px var(--mono);color:var(--mut);letter-spacing:.06em;background:var(--soft);padding:4px 10px;border-radius:999px}
.res{display:grid;gap:4px}
.res .lbl{font:13px var(--mono);color:var(--mut)}
.res strong{font:400 clamp(32px,4.6vw,44px)/1.05 var(--px);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pos,.res.pos strong{color:var(--pos)}.neg,.res.neg strong{color:var(--neg)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:76px 1fr;column-gap:12px;align-items:center}
.bl{font-size:14px;color:var(--mut);grid-row:span 2}
.track{height:12px;background:var(--soft);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;border-radius:999px}
.in{background:var(--lime)}.out{background:var(--ink)}
.bv{font:13px var(--mono);font-variant-numeric:tabular-nums;margin-top:4px}
.swing{margin:-16px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:500 16px var(--mono)}
.tag{font:500 12px var(--mono);letter-spacing:.08em;background:var(--lime);color:var(--limeink);padding:4px 11px;border-radius:999px}
.blk h2{font:700 clamp(24px,3vw,32px)/1.1 var(--sans);letter-spacing:-.03em;margin:0 0 14px;text-wrap:balance}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:20px}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:13px 20px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font:500 12px var(--mono);letter-spacing:.06em;color:var(--mut);border-bottom:1px solid var(--line);font-weight:500}
tbody td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
td:not(:first-child){font:14px var(--mono);font-variant-numeric:tabular-nums}
td small{color:var(--mut);font-size:12px;margin-left:6px;font-family:var(--mono)}
tfoot td{font-weight:700;background:var(--limebar);border-top:1px solid var(--line2)}
tfoot td:not(:first-child){font-weight:500}
.d{font:13px var(--mono)}
.up,.dnc{color:var(--pos)}.dn,.upc{color:var(--neg)}.z{color:var(--faint)}
.notes ul{margin:0;padding:22px 24px 22px 42px;background:var(--card);border:1px solid var(--line);border-radius:20px;display:grid;gap:10px}
.notes li{max-width:74ch;color:#2A2A20}
.small{margin:0 0 14px;color:var(--mut);max-width:65ch}
.alt table{min-width:440px}
.foot{font:12px var(--mono);color:var(--mut);border-top:1px solid var(--line);padding-top:20px}


.periods.q4{grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.periods.q4 .res strong{font-size:clamp(21px,2.5vw,27px)}
.periods.q4 .bv{font-size:12px}
.per{min-width:0}
.tw{max-width:100%}
html,body{overflow-x:hidden}
.res .mg{font:12px var(--mono);color:var(--mut)}
.chart{margin:0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 20px 12px}
.chart figcaption{font:500 12px var(--mono);letter-spacing:.06em;color:var(--mut);margin-bottom:10px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.bpos{fill:var(--lime)}
.bneg{fill:var(--neg)}
.axis{stroke:var(--line2);stroke-width:1}
text.cv{fill:var(--ink);font:500 15px var(--mono)}
text.cl{fill:var(--mut);font:13px var(--mono)}
table{min-width:640px}
table.mini{min-width:400px}
.tabs{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tb{font:600 15px var(--sans);padding:10px 20px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--mut);cursor:pointer}
.tb:hover{background:var(--card);color:var(--ink)}
.tb.on{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.pane{display:grid;gap:40px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.vc{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;display:grid;gap:20px;align-content:start}
.vc-h{display:grid;gap:4px}
.vc-h h3{font:700 26px var(--sans);letter-spacing:-.03em;margin:0}
.vc-h .sub{background:none;padding:0;color:var(--mut);font:14px var(--sans);letter-spacing:0}
.vres{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vr{display:grid;gap:2px;padding:14px 16px;border-radius:16px;background:var(--soft)}
.vr .lbl{font:12px var(--mono);color:var(--mut)}
.vr strong{font:400 22px var(--px);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.vr.pos strong{color:var(--pos)}.vr.neg strong{color:var(--neg)}
.vr .mg{font:12px var(--mono);color:var(--mut)}
.dual{display:grid;gap:4px}
.vc .bar{grid-template-columns:72px 1fr}
.vc .bv em{font-style:normal;color:var(--mut)}
table.mini{min-width:340px}
table.mini th,table.mini td{padding:9px 16px}
.vt{margin:0;font-size:14px;color:var(--mut);line-height:1.5}
.vt .k{font:500 11px var(--mono);letter-spacing:.08em;color:var(--ink);background:var(--soft);padding:3px 8px;border-radius:999px;margin-right:8px}
tr.mid td{background:var(--soft);font-weight:600}
tr.mid td:not(:first-child){font-weight:500}
table.alt2{min-width:360px}
@media (max-width:560px){.nav-r .meta{display:none}}

const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open(pw){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.d)));
}
function show(html){const a=document.getElementById('app');a.innerHTML=html;a.hidden=false;document.getElementById('gate').hidden=true;
 const l=document.getElementById('lock');l.hidden=false;l.onclick=()=>{try{sessionStorage.removeItem('pnl')}catch(e){}location.reload()};
 a.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{
  a.querySelectorAll('.tb').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-selected',on)});
  a.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!==b.dataset.tab);
  window.scrollTo({top:0,behavior:'instant'});
 });}
document.getElementById('f').addEventListener('submit',async e=>{
 e.preventDefault();const pw=document.getElementById('pw').value,err=document.getElementById('err'),f=e.target;
 err.textContent='';
 try{const h=await open(pw);try{sessionStorage.setItem('pnl',pw)}catch(x){}show(h)}
 catch(x){err.textContent='senha incorreta. confira e tente de novo.';f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}
});
(async()=>{try{const s=sessionStorage.getItem('pnl');if(s)show(await open(s))}catch(e){}})();
</script>
